<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream Drive SA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header>

        <h1>DreamDrive SA</h1>

        <p>Affordable and Reliable Car Rentals</p>

        <!-- Navigation -->
        <nav>
            <a href="index.html">Home</a> |
            <a href="about.html">About</a> |
            <a href="vehicles.html">Vehicles</a> |
            <a href="services.html">Services</a> |
            <a href="enquiry.html">Enquiry</a> |
            <a href="contact.html">Contact</a>
        </nav>

    </header>

    <hr>

    <!-- Main Content -->
    <main>

        <h2>Make an Enquiry</h2>

        <p>
            Complete the form below if you would like to enquire
            about renting a vehicle.
        </p>

        <!-- Enquiry Form -->
        <form>

            <p>
                <label>Full Name:</label><br>
                <input type="text" name="fullname">
            </p>

            <p>
                <label>Email Address:</label><br>
                <input type="email" name="email">
            </p>

            <p>
                <label>Phone Number:</label><br>
                <input type="text" name="phone">
            </p>

            <p>
                <label>Select Vehicle:</label><br>

                <select name="vehicle">

                    <option>Choose a vehicle</option>
                    <option>Economy Hatchback</option>
                    <option>Family Sedan</option>
                    <option>Family SUV</option>
                    <option>Premium Sedan</option>

                </select>
            </p>

            <p>
                <label>Rental Start Date:</label><br>
                <input type="date" name="startdate">
            </p>

            <p>
                <label>Rental End Date:</label><br>
                <input type="date" name="enddate">
            </p>

            <p>
                <label>Additional Information:</label><br>

                <textarea name="message" rows="6" cols="40"></textarea>
            </p>

            <p>
                <input type="submit" value="Submit Enquiry">
            </p>

        </form>

    </main>

    <hr>

    <!-- Footer -->
    <footer>

        <p>DreamDrive SA</p>
        <p>© 2026 DreamDrive SA</p>

    </footer>

</body>
</html>
